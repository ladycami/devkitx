name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: mypy (strict)
        run: mypy src/devkitx
      - name: mypy (strict, Python 3.10 semantics)
        run: mypy --python-version 3.10 src/devkitx

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Tests with coverage
        run: pytest -q --cov-fail-under=55
      - name: Doctests
        run: pytest -q -o addopts="" --doctest-modules src/devkitx/security src/devkitx/utils src/devkitx/config.py

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - name: Install package (non-editable) with all extras
        run: pip install ".[all]" "bandit>=1.7" "pip-audit>=2.7"
      - name: bandit
        run: bandit -q -r src -ll
      - name: pip-audit (installed dependencies)
        run: pip-audit --strict

  build:
    name: Build and install check
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import devkitx, devkitx.security, devkitx.compliance; print(devkitx.__version__)"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dev-qol-toolkit"
version = "0.1.0"
description = "Quality-of-life utilities for Python engineers: JSON, files, logging, CLI, HTTP."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SerityOps Innovations", email = "info@serityops.dev" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<0.28",
  "click>=8.0.0",
  "rich>=13.0.0",
  "bcrypt>=4.0.0"
]
keywords = [
  "utilities", "developer-tools", "json", "logging", "cli",
  "http", "files", "devtools", "async", "configuration",
  "validation", "security", "string-manipulation"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/serityops/dev-qol-toolkit"
Issues = "https://github.com/serityops/dev-qol-toolkit/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.5",
  "black>=24.8",
  "types-requests",
]

[tool.hatch.build.targets.sdist]
include = ["src/dev_qol_toolkit", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_qol_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true

[tool.pytest.ini_options]
addopts = "-q --cov=dev_qol_toolkit --cov-report=term-missing"
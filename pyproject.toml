[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devkitx"
version = "2.0.1"
description = "Security-first Python utilities for government, healthcare, and financial applications."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LadyCami" }]
keywords = [
    "security",
    "compliance",
    "audit",
    "nist",
    "fedramp",
    "hipaa",
    "soc2",
    "pii",
    "secrets",
    "utilities",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
cli = ["typer>=0.9.0", "rich>=13.0.0"]
audit = ["structlog>=23.0.0"]
yaml = ["pyyaml>=6.0"]
toml = ["tomli>=2.0; python_version < '3.11'"]
http2 = ["h2>=4.0.0"]
crypto = ["bcrypt>=4.1"]
all = ["devkitx[cli,audit,yaml,toml,http2,crypto]"]
dev = [
    "devkitx[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
devkitx = "devkitx.cli.main:main"

[project.urls]
Homepage = "https://github.com/ladycami/devkitx"
Documentation = "https://github.com/ladycami/devkitx#readme"
Repository = "https://github.com/ladycami/devkitx"
Issues = "https://github.com/ladycami/devkitx/issues"
Changelog = "https://github.com/ladycami/devkitx/blob/develop/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/devkitx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "S"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments as default values; this is its documented pattern.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Control catalog: long reference descriptions are data, not code.
"src/devkitx/compliance/nist_controls.py" = ["E501"]
# Tests use assert, fake credentials and long fixture strings by design.
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=devkitx --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:devkitx.*"]

[tool.coverage.run]
source = ["devkitx"]
branch = true